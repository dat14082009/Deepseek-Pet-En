<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http://127.0.0.1:*;">
<title>DeepSeek Chibi Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #root {
    width: 100%;
    height: 100%;
    background: transparent !important;
    pointer-events: none;
  }
  /* Hidden composer textarea to satisfy widget initialization */
  textarea.host-composer {
    position: fixed;
    left: -10000px;
    top: -10000px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="root"><textarea class="host-composer" aria-label="Standalone host composer"></textarea></div>

<script>
(function () {
  if (!window.electronOverlay) return;

  var isMouseDown = false;
  var isHoveringWidget = false;

  function onPointerDown(e) {
    isMouseDown = true;
  }

  function onPointerUp(e) {
    isMouseDown = false;
    if (e && typeof e.clientX === 'number') {
      checkPoint(e.clientX, e.clientY);
    }
  }

  window.addEventListener('mousedown', onPointerDown, true);
  window.addEventListener('pointerdown', onPointerDown, true);
  window.addEventListener('mouseup', onPointerUp, true);
  window.addEventListener('pointerup', onPointerUp, true);
  window.addEventListener('pointercancel', onPointerUp, true);

  // When focus leaves the window (user clicked on their browser/desktop),
  // immediately release mouse capture and ignore mouse events so browser clicks are never blocked!
  window.addEventListener('blur', function () {
    isMouseDown = false;
    if (isHoveringWidget) {
      isHoveringWidget = false;
      window.electronOverlay.setIgnoreMouseEvents(true);
    }
    try {
      var menu = document.querySelector('.dshwv-menu.dshwv-menu-open');
      if (menu) menu.classList.remove('dshwv-menu-open');
    } catch (e) {}
  });

  function isOverInteractiveArea(x, y) {
    if (typeof x !== 'number' || typeof y !== 'number') return false;

    // 1. Direct hit-test on elementFromPoint
    var el = document.elementFromPoint(x, y);
    if (el && el !== document.body && el !== document.documentElement && el.id !== 'root') {
      if (el.nodeType === 3) el = el.parentElement;
      if (el && !(el.tagName === 'TEXTAREA' && el.classList.contains('host-composer'))) {
        if (el.closest('.dshwv-root') ||
            el.closest('.dshwv-menu') ||
            el.closest('.dshwv-pop') ||
            el.closest('[class*="dshwv-"]') ||
            el.closest('button') ||
            el.closest('input') ||
            el.closest('select') ||
            el.closest('dialog') ||
            el.closest('a')) {
          return true;
        }
      }
    }

    // 2. Bounding rectangle checks for chibi character elements
    var rootEl = document.querySelector('.dshwv-root');
    if (rootEl) {
      var imgEl = rootEl.querySelector('.dshwv-img');
      if (imgEl) {
        var r = imgEl.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return true;
        }
      }
      var btnEl = rootEl.querySelector('.dshwv-menu-btn');
      if (btnEl && !btnEl.classList.contains('dshwv-menu-btn-hidden')) {
        var br = btnEl.getBoundingClientRect();
        if (x >= br.left && x <= br.right && y >= br.top && y <= br.bottom) {
          return true;
        }
      }
      var popEl = rootEl.querySelector('.dshwv-pop.dshwv-pop-open');
      if (popEl && popEl.style.display !== 'none') {
        var pr = popEl.getBoundingClientRect();
        if (x >= pr.left && x <= pr.right && y >= pr.top && y <= pr.bottom) {
          return true;
        }
      }
    }

    // 3. Bounding rectangle check for open menu
    var menuEl = document.querySelector('.dshwv-menu.dshwv-menu-open');
    if (menuEl && menuEl.style.display !== 'none') {
      var mr = menuEl.getBoundingClientRect();
      if (x >= mr.left && x <= mr.right && y >= mr.top && y <= mr.bottom) {
        return true;
      }
    }

    return false;
  }

  function checkPoint(x, y) {
    var shouldCapture = isOverInteractiveArea(x, y);

    // Keep capture only if active dragging is in progress
    var isDragging = document.querySelector('.dshwv-root.dshwv-dragging') !== null;
    if (isDragging && isMouseDown) {
      shouldCapture = true;
    }

    if (shouldCapture !== isHoveringWidget) {
      isHoveringWidget = shouldCapture;
      window.electronOverlay.setIgnoreMouseEvents(!shouldCapture);
    }
  }

  window.addEventListener('mousemove', function (e) {
    if (e.buttons === 0) isMouseDown = false;
    checkPoint(e.clientX, e.clientY);
  }, true);

  window.addEventListener('pointermove', function (e) {
    if (e.buttons === 0) isMouseDown = false;
    checkPoint(e.clientX, e.clientY);
  }, true);

  window.addEventListener('mouseleave', function () {
    isMouseDown = false;
    if (isHoveringWidget) {
      isHoveringWidget = false;
      window.electronOverlay.setIgnoreMouseEvents(true);
    }
  }, true);

  // Initial state: ignore transparent backdrop
  window.electronOverlay.setIgnoreMouseEvents(true);
})();
</script>

<script src="/dsh-whale/widget.js"></script>
</body>
</html>
