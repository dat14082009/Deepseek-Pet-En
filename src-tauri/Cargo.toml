[package]
name = "dsh-whale-tauri"
version = "0.4.2"
description = "DeepSeek Chibi Whale Standalone Desktop Overlay (Tauri v2)"
authors = ["DeepSeek Whale"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
